# Fason hisob — serverda ishga tushirish (Docker).
# app: ilova + server (faqat serverning ichida 127.0.0.1:8090 da ochiq).
# caddy: 80/443 portlari bo'sh bo'lsa — avtomatik HTTPS (profile: caddy).
#        Serverda nginx bo'lsa, install.sh nginx orqali ulaydi.
services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: node server/server.js
    environment:
      - PORT=8080
      - DATA_DIR=/data
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ..:/app:ro          # ilova va server kodi (git dan)
      - ../data:/data       # ma'lumotlar bazasi va kunlik zaxiralar
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
